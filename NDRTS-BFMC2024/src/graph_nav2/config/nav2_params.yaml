# ========================================================================
#  Nav2 minimal configuration – Jetson Nano – Graph-based waypoint nav
# ========================================================================

# ------------------------------------------------------------------------
#  Global namespace
# ------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time:            false
    min_particles:           500
    max_particles:           2000
    alpha1:                  0.2
    alpha2:                  0.2
    alpha3:                  0.2
    alpha4:                  0.2
    alpha5:                  0.2
    do_beamskip:             false
    update_min_d:            0.25
    update_min_a:            0.2
    laser_model_type:        likelihood_field
    tf_broadcast:            true
    set_initial_pose:        false

map_server:
  ros__parameters:
    # ↳ *** absolute path – NO substitutions! ***
    yaml_filename: "/home/ndrts/workspaces/NDRTS-BFMC2024/src/graph_nav2/maps/blank_map.yaml"
    frame_id:      "map"
    use_sim_time:  false

# ------------------------------------------------------------------------
#  Localisation manager
# ------------------------------------------------------------------------
lifecycle_manager_localization:
  ros__parameters:
    autostart:           true
    node_names:
      - map_server
      - amcl

# ------------------------------------------------------------------------
#  Navigation (BT Navigator, Planner, Controller …)
# ------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time:        false
    global_frame:        map
    robot_base_frame:    base_link
    default_bt_xml_filename: "navigate_w_replanning_time.xml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time:               false
    planner_plugins:            ["GridBased"]
    GridBased:
      plugin:                   "nav2_navfn_planner/NavfnPlanner"
      tolerance:                0.5

controller_server:
  ros__parameters:
    use_sim_time:               false
    controller_frequency:       20.0
    min_x_velocity_threshold:   0.001
    controller_plugins:         ["FollowPath"]
    # ---------------------------------------------------------------
    #  Built-in pure-pursuit controller (Humble package)
    # ---------------------------------------------------------------
    FollowPath:
      plugin:                   "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel:       0.3          # m/s
      lookahead_dist:           0.6          # m
      max_angular_accel:        2.5          # rad/s²
      use_rotate_to_heading:    true
      allow_reversing:          true

smoother_server:
  ros__parameters:
    use_sim_time:         false
    smoother_plugins:     ["simple_smoother"]
    simple_smoother:
      plugin:             "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    use_sim_time:         false
    behavior_plugins:     ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin:             "nav2_behaviors/Spin"
    backup:
      plugin:             "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin:             "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time:         false
    stop_on_failure:      true

velocity_smoother:
  ros__parameters:
    use_sim_time:         false
    smoothing_frequency:  20.0

# ------------------------------------------------------------------------
#  Manager for navigation nodes
# ------------------------------------------------------------------------
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # These must match the names above
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - bt_navigator
      - waypoint_follower
      - behavior_server
      - velocity_smoother
